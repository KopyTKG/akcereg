name: Docker Scout Code Scanning

on:
  schedule:
    - cron: '0 0 * * */2'
  workflow_dispatch:

jobs:
  docker-scout-scan:
    name: Scan Multiple Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: 
          - ghcr.io/kopytkg/akcereg-be:latest
          - ghcr.io/kopytkg/akcereg-fe:latest

    steps:
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: thekrewkopy
          password: ${{ secrets.DCKR_PAT }}

      - name: Pull and Scan Image
        run: |
          echo "Scanning image: ${{ matrix.image }}"
          docker pull ${{ matrix.image }}
          docker scout cves ${{ matrix.image }} --format sarif > scout-results-${{ matrix.image }}.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: scout-results-${{ matrix.image }}.sarif
