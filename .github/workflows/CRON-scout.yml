name: Docker Scout Code Scanning

on:
  schedule:
    - cron: '0 0 * * */2'
  workflow_dispatch:

jobs:
  docker-scout-scan:
    name: Scan Multiple Docker Images
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: 
          - "ghcr.io/kopytkg/akcereg-be:latest"
          - "ghcr.io/kopytkg/akcereg-fe:latest"

    steps:
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Scout CLI
        run: |
          curl -sSfL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s --
          docker scout version

      - name: Pull Image
        run: docker pull ${{ matrix.image }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: thekrewkopy
          password: ${{ secrets.DCKR_PAT }}

      - name: Scan Image with Docker Scout
        run: |
          IMAGE_NAME=$(echo "${{ matrix.image }}" | sed 's|.*/||' | sed 's/:/-/')
          docker scout cves ${{ matrix.image }} --format sarif --output "scout-results-${IMAGE_NAME}.sarif"
          echo "SARIF_FILE=scout-results-${IMAGE_NAME}.sarif" >> $GITHUB_ENV
        env:
          DOCKER_SCOUT_PLATFORM_TOKEN: ${{ secrets.DCKR_PAT }}

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.SARIF_FILE }}
          category: Docker Scout

      - name: Debug - List Files
        if: failure()
        run: |
          pwd
          ls -R


